{% extends "base.html" %}

{% block title %}Invalid Reset Link | mycatalogue{% endblock %}

{% block content %}
<div class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow-sm sm:rounded-xl sm:px-10 border border-red-200 text-center">
            <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center text-red-600 font-bold mx-auto mb-4 text-xl">
                ✕
            </div>
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Invalid or Expired Link</h2>
            <p class="text-sm text-slate-600 mb-6">
                The password reset link was either invalid, already used, or expired (older than 24 hours).
            </p>
            <div>
                <a href="{% url 'users:password_reset' %}" class="w-full btn-primary py-2.5 text-sm font-semibold inline-block">
                    Request a new password reset link
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
