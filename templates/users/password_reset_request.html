{% extends "base.html" %}

{% block title %}Reset Password | mycatalogue{% endblock %}

{% block content %}
<div class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="mt-2 text-center text-3xl font-extrabold text-slate-900 tracking-tight">
            Reset your password
        </h2>
        <p class="mt-2 text-center text-sm text-slate-600">
            Remember your credentials?
            <a href="{% url 'users:login' %}" class="font-medium text-indigo-600 hover:text-indigo-500">
                Sign in
            </a>
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow-sm sm:rounded-xl sm:px-10 border border-slate-200">
            <form class="space-y-5" method="POST" action="{% url 'users:password_reset' %}">
                {% csrf_token %}

                <div>
                    <label for="{{ form.email.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-1">
                        Email address
                    </label>
                    {{ form.email }}
                    {% if form.email.errors %}
                    <p class="mt-1 text-xs text-red-600">{{ form.email.errors.0 }}</p>
                    {% endif %}
                </div>

                <div>
                    <button type="submit" class="w-full btn-primary py-2.5 text-sm font-semibold">
                        Send Password Reset Link
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
