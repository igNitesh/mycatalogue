{% extends "base.html" %}

{% block title %}Password Reset Requested | mycatalogue{% endblock %}

{% block content %}
<div class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow-sm sm:rounded-xl sm:px-10 border border-slate-200 text-center">
            <div class="w-12 h-12 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold mx-auto mb-4 text-xl">
                ✉
            </div>
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Check your email</h2>
            <p class="text-sm text-slate-600 mb-6">
                If an active account exists with the provided email address, a password reset link has been dispatched.
            </p>
            <div>
                <a href="{% url 'users:login' %}" class="w-full btn-primary py-2.5 text-sm font-semibold inline-block">
                    Return to sign in
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
