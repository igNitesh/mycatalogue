{% if message %}
    {% if is_valid %}
        <div class="mt-1.5 flex items-center text-xs font-medium text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-md px-2.5 py-1">
            <svg class="h-4 w-4 mr-1.5 text-emerald-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            <span>{{ message }}</span>
        </div>
    {% else %}
        <div class="mt-1.5 flex items-center text-xs font-medium text-red-700 bg-red-50 border border-red-200 rounded-md px-2.5 py-1">
            <svg class="h-4 w-4 mr-1.5 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>{{ message }}</span>
        </div>
    {% endif %}
{% endif %}
