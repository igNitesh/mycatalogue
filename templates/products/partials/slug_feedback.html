{% if is_valid %}
<div class="mt-1 flex items-center text-xs text-emerald-600 font-medium space-x-1.5" role="status">
    <svg class="h-4 w-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
    </svg>
    <span>{{ message }} <code class="px-1 py-0.5 bg-emerald-50 text-emerald-700 rounded text-[11px] font-mono font-semibold">{{ normalized_slug }}</code></span>
</div>
{% else %}
<div class="mt-1 flex items-center text-xs text-rose-600 font-medium space-x-1.5" role="alert">
    <svg class="h-4 w-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
    </svg>
    <span>{{ message }}</span>
</div>
{% endif %}
